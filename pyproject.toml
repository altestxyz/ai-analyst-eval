[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-analyst-eval"
version = "1.0.0"
description = "Text-to-SQL evaluation of laptop-class and frontier models at three levels of context"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "sqlglot>=25.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
aae = "aae.__main__:main"

[tool.setuptools]
packages = ["aae"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E701", "E702", "E741"]

[tool.ruff.lint.per-file-ignores]
"aae/report.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
